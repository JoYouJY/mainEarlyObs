<script>
async function clearCache(){
  var indexedDBHandle=window.indexedDB||window.mozIndexedDB||window.webkitIndexedDB||window.msIndexedDB;
  if(indexedDBHandle){indexedDBHandle.deleteDatabase("UnityCache");}
  if(window.caches){
    var keys=await caches.keys();
    await Promise.all(keys.filter(function(key){
      return key.indexOf("UnityCache")!==-1;
    }).map(function(key){
      return caches.delete(key);
    }));
  }
  if(navigator.serviceWorker){
    var registrations=await navigator.serviceWorker.getRegistrations();
    await Promise.all(registrations.map(function(registration){
      return registration.unregister();
    }));
  }
  location.reload();
}
</script>

<script>
var chains="fantom";
var container=document.querySelector("#unity-container");
var canvas=document.querySelector("#unity-canvas");
var loadingBar=document.querySelector("#unity-loading-bar");
var warningBanner=document.querySelector("#unity-warning");
const ASPECT_RATIO=16/9;

function resizeCanvas(){
  var windowWidth=window.innerWidth;
  var windowHeight=window.innerHeight;
  var windowRatio=windowWidth/windowHeight;
  var newWidth,newHeight;
  if(windowRatio>ASPECT_RATIO){
    newHeight=windowHeight;
    newWidth=newHeight*ASPECT_RATIO;
  }else{
    newWidth=windowWidth;
    newHeight=newWidth/ASPECT_RATIO;
  }
  canvas.style.width=newWidth+"px";
  canvas.style.height=newHeight+"px";
}

window.addEventListener("resize",resizeCanvas);
resizeCanvas();
setTimeout(resizeCanvas,2000);
</script>
<script>
const UNITY_DATA_URL="/Build/build.data";
const UNITY_DATA_BYTES=227962548;
const CHUNK_URLS=[
  "Build/build.data.01","Build/build.data.02","Build/build.data.03",
  "Build/build.data.04","Build/build.data.05","Build/build.data.06",
  "Build/build.data.07","Build/build.data.08","Build/build.data.09",
  "Build/build.data.10","Build/build.data.11","Build/build.data.12",
  "Build/build.data.13","Build/build.data.14","Build/build.data.15",
  "Build/build.data.16","Build/build.data.17","Build/build.data.18",
  "Build/build.data.19"
];
const isAppleWebKitMobile=/iPhone|iPad|iPod/i.test(navigator.userAgent);
const isMobileDevice=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

function setLoadingProgress(percent){
  var progressbar=document.querySelector(".progress");
  if(progressbar){
    var value=Math.max(0,Math.min(100,percent));
    progressbar.style.setProperty("--progress",value+"%");
  }
}

function showStartupMessage(message,details){
  loadingBar.style.display="none";
  var messageDiv=document.createElement("div");
  messageDiv.style.position="fixed";
  messageDiv.style.top="50%";
  messageDiv.style.left="50%";
  messageDiv.style.transform="translate(-50%, -50%)";
  messageDiv.style.maxWidth="520px";
  messageDiv.style.width="calc(100% - 40px)";
  messageDiv.style.padding="20px";
  messageDiv.style.backgroundColor="#111";
  messageDiv.style.color="#fff";
  messageDiv.style.zIndex="1000";
  messageDiv.style.border="1px solid #555";
  messageDiv.style.borderRadius="5px";
  messageDiv.style.textAlign="center";
  messageDiv.style.fontFamily="Arial, sans-serif";

  var text=document.createElement("p");
  text.innerText=message;
  messageDiv.appendChild(text);

  if(details){
    var detail=document.createElement("p");
    detail.innerText=details;
    detail.style.fontSize="12px";
    detail.style.color="#bbb";
    detail.style.wordBreak="break-word";
    messageDiv.appendChild(detail);
  }

  var retryButton=document.createElement("button");
  retryButton.innerText="Retry";
  retryButton.style.marginTop="12px";
  retryButton.style.padding="10px 20px";
  retryButton.style.backgroundColor="#fff";
  retryButton.style.color="#111";
  retryButton.style.border="none";
  retryButton.style.cursor="pointer";
  retryButton.onclick=function(){location.reload();};
  messageDiv.appendChild(retryButton);
  document.body.appendChild(messageDiv);
}

async function waitForServiceWorkerControl(){
  if(navigator.serviceWorker.controller){return;}
  await new Promise(function(resolve){
    var timeout=setTimeout(resolve,8000);
    navigator.serviceWorker.addEventListener("controllerchange",function(){
      clearTimeout(timeout);
      resolve();
    },{once:true});
  });
}

async function ensureUnityDataWorker(){
  if(!("serviceWorker" in navigator)){
    throw new Error("Service Worker is not supported.");
  }
  if(location.protocol==="file:"){
    throw new Error("Service Worker requires an HTTP or HTTPS page.");
  }

  var registration=await navigator.serviceWorker.register("/unity-data-sw.js",{
    scope:"/",
    updateViaCache:"none"
  });
  await registration.update();
  await navigator.serviceWorker.ready;
  await waitForServiceWorkerControl();

  var response=await fetch(UNITY_DATA_URL,{method:"HEAD",cache:"no-store"});
  if(!response.ok){
    throw new Error("Unity data stream responded with "+response.status+".");
  }
  var contentLength=response.headers.get("Content-Length");
  if(contentLength!==String(UNITY_DATA_BYTES)){
    throw new Error("Unity data stream size mismatch: "+(contentLength||"missing")+".");
  }
  if(response.headers.get("Content-Encoding")){
    throw new Error("Unity data stream must not be content-encoded.");
  }
  return true;
}

async function loadAndCombineChunksForDesktop(chunkUrls){
  console.warn("Using desktop-only Unity data chunk fallback.");
  var chunks=[];
  var loadedChunks=0;
  for(var i=0;i<chunkUrls.length;i++){
    var response=await fetch(chunkUrls[i]);
    if(!response.ok){
      throw new Error("Failed to load chunk: "+chunkUrls[i]);
    }
    var data=await response.arrayBuffer();
    chunks.push(data);
    loadedChunks++;
    setLoadingProgress((loadedChunks/chunkUrls.length)*50);
  }

  var totalSize=chunks.reduce(function(sum,chunk){return sum+chunk.byteLength;},0);
  var combinedBuffer=new Uint8Array(totalSize);
  var offset=0;
  for(var j=0;j<chunks.length;j++){
    combinedBuffer.set(new Uint8Array(chunks[j]),offset);
    offset+=chunks[j].byteLength;
  }
  return URL.createObjectURL(new Blob([combinedBuffer],{type:"application/octet-stream"}));
}

function unityShowBanner(msg,type){
  if(!warningBanner){
    console[type==="error"?"error":"warn"](msg);
    return;
  }
  function updateBannerVisibility(){
    warningBanner.style.display=warningBanner.children.length?"block":"none";
  }
  var div=document.createElement("div");
  div.innerHTML=msg;
  warningBanner.appendChild(div);
  if(type=="error"){
    div.style="background: red; padding: 10px;";
  }else{
    if(type=="warning"){
      div.style="background: yellow; padding: 10px;";
    }
    setTimeout(function(){
      if(div.parentNode){warningBanner.removeChild(div);}
      updateBannerVisibility();
    },5000);
  }
  updateBannerVisibility();
}

function bootUnity(dataUrl){
  var buildUrl="Build";
  var loaderUrl=buildUrl+"/Build.loader.js";
  var config={
    dataUrl:dataUrl,
    frameworkUrl:buildUrl+"/Build.framework.js",
    codeUrl:buildUrl+"/Build.wasm",
    streamingAssetsUrl:"StreamingAssets",
    companyName:"Jojo Dream Studio",
    productName:"FateAdventureRPG",
    productVersion:"1.0.0",
    showBanner:unityShowBanner,
    cacheControl:function(url){
      var normalized=String(url);
      if(normalized===dataUrl||normalized.endsWith("/Build/build.data")||normalized.endsWith("Build/build.data")){
        return "no-store";
      }
      return normalized.match(/\.bundle/)?"must-revalidate":"no-store";
    }
  };
  var script=document.createElement("script");
  script.src=loaderUrl;
  script.onload=function(){
    createUnityInstance(canvas,config,function(progress){
      setLoadingProgress(progress*100);
    }).then(function(unityInstance){
      window.unityInstance=unityInstance;
      loadingBar.style.display="none";
    }).catch(function(message){
      showStartupMessage("The game could not finish loading. Please retry, or contact support if it keeps happening.",String(message));
    });
  };
  script.onerror=function(){
    showStartupMessage("The Unity loader could not be downloaded. Please retry in a moment.");
  };
  document.body.appendChild(script);
}

function releaseUnityResources(){
  try{
    if(window.unityInstance&&!window.__unityQuitting){
      window.__unityQuitting=true;
      var quitPromise=window.unityInstance.Quit&&window.unityInstance.Quit();
      if(quitPromise&&quitPromise.catch){
        quitPromise.catch(function(){});
      }
    }
  }catch(error){
    console.warn("Unity cleanup failed:",error);
  }
  if(canvas){
    canvas.width=1;
    canvas.height=1;
    canvas.style.display="none";
  }
}

window.addEventListener("pagehide",releaseUnityResources);
window.addEventListener("beforeunload",releaseUnityResources);

async function loadUnity(){
  setLoadingProgress(0);
  loadingBar.style.display="block";
  var dataUrl=UNITY_DATA_URL;

  try{
    await ensureUnityDataWorker();
    console.log("Unity data stream Service Worker is ready.");
  }catch(error){
    console.error("Unity data stream Service Worker failed:",error);
    if(isMobileDevice){
      showStartupMessage("The mobile-safe loader could not start on this device. Please retry after clearing browser storage, or contact support with this message.",error.message);
      return;
    }
    try{
      dataUrl=await loadAndCombineChunksForDesktop(CHUNK_URLS);
    }catch(fallbackError){
      showStartupMessage("The desktop fallback loader could not prepare the game data.",fallbackError.message);
      return;
    }
  }

  console.log("Final data URL for createUnityInstance:",dataUrl);
  bootUnity(dataUrl);
}

if(isAppleWebKitMobile){
  var messageDiv=document.createElement("div");
  messageDiv.innerText="WARNING: iPhone/iPad WebKit detected. WebKit memory management may terminate the browser if memory usage is too high. Would you like to proceed?\n\nAndroid, Windows, and MacBook systems are recommended for optimal performance.";
  messageDiv.style.position="fixed";
  messageDiv.style.top="50%";
  messageDiv.style.left="50%";
  messageDiv.style.transform="translate(-50%, -50%)";
  messageDiv.style.padding="20px";
  messageDiv.style.backgroundColor="#234567";
  messageDiv.style.color="yellow";
  messageDiv.style.zIndex="1000";
  messageDiv.style.borderRadius="5px";
  messageDiv.style.textAlign="center";
  var continueButton=document.createElement("button");
  continueButton.innerText="Proceed Anyway";
  continueButton.style.marginTop="15px";
  continueButton.style.padding="10px 20px";
  continueButton.style.backgroundColor="#ffffff";
  continueButton.style.color="#234567";
  continueButton.style.border="none";
  continueButton.style.borderRadius="5px";
  continueButton.style.cursor="pointer";
  messageDiv.appendChild(document.createElement("br"));
  messageDiv.appendChild(continueButton);
  document.body.appendChild(messageDiv);
  continueButton.addEventListener("click",function(){
    document.body.removeChild(messageDiv);
    loadUnity();
  });
}else{
  loadUnity();
}
</script>
<script>

window.addEventListener("beforeinstallprompt",function(e){

  deferredPrompt=e;
});
function showInstallPrompt(){

    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){
      canvas.style.display="block";
      deferredPrompt=null;
